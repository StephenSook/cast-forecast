name: ci
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pillow opencv-python-headless colour-science mediapipe pytest ruff
      - run: python scripts/fetch_models.py
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
